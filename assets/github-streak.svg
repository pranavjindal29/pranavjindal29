<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img" aria-labelledby="title desc">
  <title id="title">Pranav Jindal GitHub contribution streak</title>
  <desc id="desc">1,531 total contributions, a 0-day current streak, and a 45-day longest streak.</desc>
  <style>
    @keyframes currstreak { 0% { font-size: 3px; opacity: 0.2; } 80% { font-size: 34px; opacity: 1; } 100% { font-size: 28px; opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; } 100% { opacity: 1; } }
  </style>
  <defs>
    <clipPath id="outer_rectangle"><rect width="495" height="195" rx="4.5"/></clipPath>
    <mask id="mask_out_ring_behind_fire"><rect width="495" height="195" fill="white"/><ellipse cx="247.5" cy="32" rx="13" ry="18" fill="black"/></mask>
  </defs>
  <g clip-path="url(#outer_rectangle)">
    <rect stroke="#000000" stroke-opacity="0" fill="#1A1B27" rx="4.5" x="0.5" y="0.5" width="494" height="194"/>
    <line x1="165" y1="28" x2="165" y2="170" stroke-width="1" stroke="#E4E2E2"/>
    <line x1="330" y1="28" x2="330" y2="170" stroke-width="1" stroke="#E4E2E2"/>
    <g fill="#70A5FD" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif">
      <text x="82.5" y="80" font-size="28" font-weight="700" style="opacity:0;animation:fadein .5s linear forwards .6s">1,531</text>
      <text x="82.5" y="116" font-size="14" style="opacity:0;animation:fadein .5s linear forwards .7s">Total Contributions</text>
      <text x="412.5" y="80" font-size="28" font-weight="700" style="opacity:0;animation:fadein .5s linear forwards 1.2s">45</text>
      <text x="412.5" y="116" font-size="14" style="opacity:0;animation:fadein .5s linear forwards 1.3s">Longest Streak</text>
    </g>
    <g fill="#38BDAE" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="12">
      <text x="82.5" y="146" style="opacity:0;animation:fadein .5s linear forwards .8s">Jan 28, 2023 - Present</text>
      <text x="247.5" y="166" style="opacity:0;animation:fadein .5s linear forwards .9s">Sep 26</text>
      <text x="412.5" y="146" style="opacity:0;animation:fadein .5s linear forwards 1.4s">May 16 - Jun 29, 2025</text>
    </g>
    <circle cx="247.5" cy="71" r="40" fill="none" stroke="#BF91F3" stroke-width="5" mask="url(#mask_out_ring_behind_fire)" style="opacity:0;animation:fadein .5s linear forwards .4s"/>
    <g transform="translate(247.5 19.5)" fill="#BF91F3" style="opacity:0;animation:fadein .5s linear forwards .6s">
      <path d="M1.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73s-3.62-1.67-3.62-3.73l.03-.36A13.76 13.76 0 0 0-8 13.99 8 8 0 0 0 0 22a8 8 0 0 0 8-8.01C8 8.6 5.41 3.79 1.5.67ZM-.29 19a3.18 3.18 0 0 1-3.22-3.14c0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04A4.8 4.8 0 0 1-.29 19Z"/>
    </g>
    <g fill="#BF91F3" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="700">
      <text x="247.5" y="80" font-size="28" style="animation:currstreak .6s linear forwards">0</text>
      <text x="247.5" y="140" font-size="14" style="opacity:0;animation:fadein .5s linear forwards .9s">Current Streak</text>
    </g>
  </g>
